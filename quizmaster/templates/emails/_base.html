<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#F4F5FB;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#1E1B4B">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F5FB;padding:32px 12px">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #E6E8F5">
    <tr><td style="background:linear-gradient(135deg,#4F46E5,#7C3AED 55%,#0891B2);background-color:#4F46E5;padding:26px 32px">
      <span style="display:inline-block;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);text-align:center;line-height:34px;color:#fff;font-weight:800;font-size:18px;vertical-align:middle">Q</span>
      <span style="color:#ffffff;font-size:20px;font-weight:700;vertical-align:middle;margin-left:8px">{{ app_name }}</span>
    </td></tr>
    <tr><td style="padding:32px">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td style="padding:18px 32px;background:#F8F9FD;border-top:1px solid #EEF0F8;font-size:12px;color:#6B7094;line-height:1.6">
      {% block footer %}You received this email because of activity on your {{ app_name }} account. If this wasn’t you, you can safely ignore it.{% endblock %}<br>
      © {{ year }} {{ app_name }} · <a href="{{ base_url }}" style="color:#4F46E5">{{ base_url }}</a>
    </td></tr>
  </table>
</td></tr></table>
</body></html>
